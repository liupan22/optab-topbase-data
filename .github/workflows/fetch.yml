name: fetch-topbase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: python3 -m pip install --quiet requests h5py

      - name: Download from Google Drive
        run: |
          set -o pipefail
          python3 download_drive.py TOPbase.h5 2>&1 | tee report.txt
          echo "download_rc=$?" >> report.txt
          ls -l TOPbase.h5 >> report.txt 2>&1 || true
          sha256sum TOPbase.h5 >> report.txt 2>&1 || true

      - name: Inspect HDF5
        if: hashFiles('TOPbase.h5') != ''
        run: |
          python3 scripts/inspect.py TOPbase.h5 >> report.txt 2>&1 || true

      - name: Commit report
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f report.txt || true
          git add -f first_response.html second_response.html || true
          git commit -m "report run ${{ github.run_number }}" || true
          git push || true

      - name: Upload artifact
        if: hashFiles('TOPbase.h5') != ''
        uses: actions/upload-artifact@v4
        with:
          name: topbase
          path: TOPbase.h5
          compression-level: 0

      - name: Publish release asset
        if: hashFiles('TOPbase.h5') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create data-${{ github.run_number }} TOPbase.h5 \
            --title "TOPbase.h5 run ${{ github.run_number }}" \
            --notes "auto-fetched from Google Drive"
